<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Файлы Аркадия</title>
    <script type="importmap">
        {
          "imports": {
            "html2canvas": "https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.esm.js"
          }
        }
    </script>
    <script src="script.js" type="module"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="icons/favicon.ico" type="x/icon">
    <style>
        .animated {
            transition: background-color 0.3s ease;
        }
    </style>

<body class="light-theme animated">
<div>
    <div class="themeChanger">
        <button id="themeToggle" class="themeChanger" onclick="changeTheme()" aria-label="Сменить тему"><img src="icons/dark.png" alt=""></button>
    </div>
    <h1 class="header">Файлы Львова Аркадия</h1>
    <h4 class="header">Самый надежный поиск из базы файлов Аркадия</h4>
</div>
<label>
    <input type="text" placeholder="Введите запрос..." id="inputSearch" value="" spellcheck="false">
    <button class="searchButton" id="buttonSearch">Искать</button>
</label>
<div id="count"></div>
<div id="searchContent"></div>
<script src="theme.js"></script>
</body>
</html>
